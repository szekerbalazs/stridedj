<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <style>
      .g  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .bx { fill: #ffffff; stroke: #64748b; stroke-width: 1; }
      .sc { fill: #ffffff; stroke: #0f172a; stroke-width: 1.8; }
      .gl { font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.06em; }
      .t  { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .b  { font-size: 12px; fill: #475569; }
      .m  { font-size: 12px; fill: #0f172a; font-family: Menlo, Consolas, 'SF Mono', monospace; }
      .c  { font-size: 12px; fill: #475569; }
      .ln { stroke: #334155; stroke-width: 1.2; fill: none; }
      .wr { stroke: #b45309; stroke-width: 1.6; fill: none; }
      .bg { stroke: #334155; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <!-- ── client ── -->
  <text x="32" y="44" class="gl">CLIENT</text>
  <rect x="32" y="56" width="170" height="104" rx="3" class="bx"/>
  <text x="117" y="82" text-anchor="middle" class="t">Telegram</text>
  <text x="117" y="104" text-anchor="middle" class="b">messages</text>
  <text x="117" y="122" text-anchor="middle" class="b">buttons: approve,</text>
  <text x="117" y="140" text-anchor="middle" class="b">sessions, feedback</text>

  <!-- ── service ── -->
  <text x="228" y="44" class="gl">STRIDEDJ SERVICE (CONTAINER)</text>
  <rect x="228" y="56" width="812" height="636" rx="4" class="g"/>

  <!-- row A -->
  <rect x="248" y="76" width="200" height="58" rx="3" class="sc"/>
  <text x="348" y="100" text-anchor="middle" class="t">Input guard</text>
  <text x="348" y="120" text-anchor="middle" class="b">allowlist · secrets · rate limit</text>

  <rect x="464" y="76" width="556" height="58" rx="3" class="bx"/>
  <text x="742" y="100" text-anchor="middle" class="t">Agent service</text>
  <text x="742" y="120" text-anchor="middle" class="b">session state · attaches the plan · fills placeholders · checks numbers</text>

  <!-- row B -->
  <rect x="248" y="152" width="500" height="200" rx="3" class="bx"/>
  <text x="264" y="174" class="t">Agent harness</text>
  <rect x="264" y="188" width="146" height="54" rx="3" class="bx"/>
  <text x="337" y="210" text-anchor="middle" class="t">Context</text>
  <text x="337" y="229" text-anchor="middle" class="b">prompt v4 · dates</text>
  <rect x="424" y="188" width="146" height="54" rx="3" class="bx"/>
  <text x="497" y="210" text-anchor="middle" class="t">LLM client</text>
  <text x="497" y="229" text-anchor="middle" class="b">Responses API</text>
  <rect x="584" y="188" width="148" height="54" rx="3" class="bx"/>
  <text x="658" y="210" text-anchor="middle" class="t">Tool registry</text>
  <text x="658" y="229" text-anchor="middle" class="b">strict schemas</text>
  <line x1="410" y1="215" x2="422" y2="215" class="ln" marker-end="url(#ar)"/>
  <line x1="570" y1="215" x2="582" y2="215" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect x="264" y="256" width="468" height="46" rx="3" class="bx"/>
  <text x="278" y="276" class="t">Final answer</text>
  <text x="278" y="294" class="m">AgentReply {kind, message, missing_fields}</text>
  <text x="264" y="324" class="b">budgets: model calls · tool calls · cost · time</text>
  <text x="264" y="342" class="b">transcript per run → evals</text>

  <rect x="764" y="152" width="256" height="200" rx="3" class="bx"/>
  <text x="780" y="174" class="t">Read-only tools</text>
  <text x="780" y="198" class="m">estimate_duration</text>
  <text x="780" y="216" class="m">find_free_slots</text>
  <text x="780" y="234" class="m">suggest_interval_sessions</text>
  <text x="780" y="252" class="m">interval_distance</text>
  <text x="780" y="270" class="m">draft_playlist</text>
  <text x="780" y="288" class="m">propose_plan</text>
  <text x="780" y="306" class="m">get_running_profile</text>
  <text x="780" y="324" class="m">predict_race_times</text>
  <line x1="732" y1="215" x2="762" y2="215" class="ln" marker-end="url(#ar)"/>

  <!-- tools → services -->
  <path d="M892,352 L892,366 M372,366 L892,366" class="ln"/>
  <line x1="372" y1="366" x2="372" y2="378" class="ln" marker-end="url(#ar)"/>
  <line x1="636" y1="366" x2="636" y2="378" class="ln" marker-end="url(#ar)"/>
  <line x1="892" y1="366" x2="892" y2="378" class="ln" marker-end="url(#ar)"/>

  <!-- row C -->
  <rect x="248" y="380" width="248" height="66" rx="3" class="bx"/>
  <text x="372" y="402" text-anchor="middle" class="t">Runs</text>
  <text x="372" y="420" text-anchor="middle" class="b">durations · cadence</text>
  <text x="372" y="437" text-anchor="middle" class="b">interval detection · targets</text>
  <rect x="512" y="380" width="248" height="66" rx="3" class="bx"/>
  <text x="636" y="402" text-anchor="middle" class="t">Calendar slots</text>
  <text x="636" y="420" text-anchor="middle" class="b">free/busy only</text>
  <text x="636" y="437" text-anchor="middle" class="b">exact start checks</text>
  <rect x="776" y="380" width="244" height="66" rx="3" class="bx"/>
  <text x="898" y="402" text-anchor="middle" class="t">Playlists</text>
  <text x="898" y="420" text-anchor="middle" class="b">tempo match · style model</text>
  <text x="898" y="437" text-anchor="middle" class="b">genres · rotation · feedback</text>

  <!-- background jobs → services -->
  <path d="M898,474 L898,462 M372,462 L898,462" class="bg"/>
  <line x1="372" y1="462" x2="372" y2="448" class="bg" marker-end="url(#ar)"/>
  <line x1="898" y1="462" x2="898" y2="448" class="bg" marker-end="url(#ar)"/>

  <!-- row D -->
  <rect x="248" y="476" width="248" height="66" rx="3" class="sc"/>
  <text x="372" y="498" text-anchor="middle" class="t">Approval store</text>
  <text x="372" y="516" text-anchor="middle" class="b">token bound to plan + user</text>
  <text x="372" y="533" text-anchor="middle" class="b">single use · 15 min</text>
  <rect x="512" y="476" width="248" height="66" rx="3" class="sc"/>
  <text x="636" y="498" text-anchor="middle" class="t">Executor</text>
  <text x="636" y="516" text-anchor="middle" class="b">the only writes</text>
  <text x="636" y="533" text-anchor="middle" class="b">calendar event · new playlist</text>
  <line x1="496" y1="509" x2="510" y2="509" class="ln" marker-end="url(#ar)"/>
  <rect x="776" y="476" width="244" height="66" rx="3" class="bx" stroke-dasharray="4 3"/>
  <text x="898" y="498" text-anchor="middle" class="t">Background jobs</text>
  <text x="898" y="516" text-anchor="middle" class="b">every 30 min</text>
  <text x="898" y="533" text-anchor="middle" class="b">plays · genres · new runs</text>

  <!-- row E -->
  <rect x="248" y="588" width="772" height="84" rx="3" class="bx"/>
  <text x="264" y="612" class="t">Local state (SQLite, never in the model's context)</text>
  <text x="264" y="634" class="b">runs and per-second series (no GPS) · music cache · plays log</text>
  <text x="264" y="654" class="b">created playlists and feedback · cost ledger · transcripts</text>

  <!-- ── external services ── -->
  <text x="1092" y="44" class="gl">EXTERNAL SERVICES</text>
  <rect x="1092" y="56" width="276" height="436" rx="4" class="g"/>
  <rect x="1108" y="76" width="244" height="58" rx="3" class="bx"/>
  <text x="1230" y="100" text-anchor="middle" class="t">OpenAI Responses API</text>
  <text x="1230" y="120" text-anchor="middle" class="b">aggregates and ids only</text>
  <rect x="1108" y="176" width="244" height="52" rx="3" class="bx"/>
  <text x="1230" y="198" text-anchor="middle" class="t">Garmin Connect</text>
  <text x="1230" y="216" text-anchor="middle" class="b">runs · HR zones · series</text>
  <rect x="1108" y="244" width="244" height="52" rx="3" class="bx"/>
  <text x="1230" y="266" text-anchor="middle" class="t">Google Calendar</text>
  <text x="1230" y="284" text-anchor="middle" class="b">free/busy · events</text>
  <rect x="1108" y="312" width="244" height="52" rx="3" class="bx"/>
  <text x="1230" y="334" text-anchor="middle" class="t">Spotify, ReccoBeats</text>
  <text x="1230" y="352" text-anchor="middle" class="b">library · tempo · playlists</text>
  <rect x="1108" y="380" width="244" height="52" rx="3" class="bx"/>
  <text x="1230" y="402" text-anchor="middle" class="t">Last.fm</text>
  <text x="1230" y="420" text-anchor="middle" class="b">artist tags → genres</text>

  <!-- client ↔ guard → agent → harness -->
  <line x1="202" y1="105" x2="246" y2="105" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line x1="448" y1="105" x2="462" y2="105" class="ln" marker-end="url(#ar)"/>
  <line x1="480" y1="134" x2="480" y2="150" class="ln" marker-end="url(#ar)"/>

  <!-- model calls: LLM client ↔ OpenAI -->
  <path d="M497,188 L497,143 L1060,143 L1060,105 L1106,105" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>

  <!-- reads via ports -->
  <path d="M1020,413 L1072,413 M1020,509 L1072,509 M1072,202 L1072,509" class="ln"/>
  <line x1="1072" y1="202" x2="1106" y2="202" class="ln" marker-end="url(#ar)"/>
  <line x1="1072" y1="270" x2="1106" y2="270" class="ln" marker-end="url(#ar)"/>
  <line x1="1072" y1="338" x2="1106" y2="338" class="ln" marker-end="url(#ar)"/>
  <line x1="1072" y1="406" x2="1106" y2="406" class="ln" marker-end="url(#ar)"/>

  <!-- writes: executor → calendar, Spotify -->
  <path d="M636,542 L636,564 L1084,564 L1084,286" class="wr"/>
  <line x1="1084" y1="286" x2="1106" y2="286" class="wr" marker-end="url(#aw)"/>
  <line x1="1084" y1="354" x2="1106" y2="354" class="wr" marker-end="url(#aw)"/>

  <!-- approve tap: client → approval store -->
  <path d="M117,160 L117,509 L246,509" class="wr" marker-end="url(#aw)"/>
  <text x="124" y="500" class="c" fill="#b45309">approve tap</text>

  <!-- ── legend ── -->
  <text x="1092" y="540" class="gl">LEGEND</text>
  <rect x="1092" y="552" width="276" height="120" rx="4" class="g"/>
  <line x1="1108" y1="574" x2="1140" y2="574" class="ln" marker-end="url(#ar)"/><text x="1150" y="578" class="b">call or read</text>
  <line x1="1108" y1="598" x2="1140" y2="598" class="wr" marker-end="url(#aw)"/><text x="1150" y="602" class="b">write (only after approval)</text>
  <line x1="1108" y1="622" x2="1140" y2="622" class="bg" marker-end="url(#ar)"/><text x="1150" y="626" class="b">background (every 30 min)</text>
  <rect x="1108" y="640" width="32" height="16" rx="2" class="sc"/><text x="1150" y="652" class="b">security control</text>

  <!-- caption -->
  <text x="32" y="728" class="c"><tspan font-weight="600" fill="#0f172a">Figure 1.</tspan> StrideDJ architecture. The model plans with read-only tools; only the executor writes, after the runner approves. Every external</text>
  <text x="32" y="746" class="c">service sits behind a port, so tests, evals and demo mode run the same agent against in-memory fakes.</text>
</svg>
