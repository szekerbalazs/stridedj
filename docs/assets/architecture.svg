<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .t { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .b { font-size: 11px; fill: #475569; }
      .m { font-size: 11px; fill: #1e3a8a; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .s { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1199" height="799" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">StrideDJ · architecture</text>
  <text x="32" y="68" class="b">A tool-calling agent in a hand-built harness: the model plans with read-only tools; writes happen only after you tap Approve.</text>

  <!-- ───────────── you (Telegram) ───────────── -->
  <rect x="32" y="110" width="190" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="127" y="136" text-anchor="middle" class="t">You · Telegram</text>
  <rect x="48" y="150" width="158" height="32" rx="10" fill="#dbeafe"/>
  <text x="127" y="170" text-anchor="middle" font-size="12" fill="#1e3a8a">"10k Z2 tonight"</text>
  <rect x="48" y="192" width="158" height="98" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="58" y="212" class="b" font-weight="600" fill="#0f172a">10 km Z2 · 18:30–19:45</text>
  <text x="58" y="230" class="b">~57 min expected (p80 58)</text>
  <text x="58" y="247" class="b">cadence target 169 spm</text>
  <text x="58" y="264" class="b">16 tracks · 59 min · ±1.2 BPM</text>
  <text x="58" y="281" class="s">proposal rendered by code</text>
  <rect x="48" y="300" width="74" height="28" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="85" y="319" text-anchor="middle" font-size="12" fill="#166534">Approve</text>
  <rect x="132" y="300" width="74" height="28" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="169" y="319" text-anchor="middle" font-size="12" fill="#991b1b">Cancel</text>
  <text x="127" y="360" text-anchor="middle" class="s">long polling: outbound only,</text>
  <text x="127" y="374" text-anchor="middle" class="s">no public endpoint</text>

  <!-- legend -->
  <rect x="80" y="440" width="142" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="92" y="460" class="t" font-size="12">Legend</text>
  <line x1="92" y1="478" x2="116" y2="478" stroke="#2563eb" stroke-width="2.5"/><text x="124" y="482" class="b">reads (tools)</text>
  <line x1="92" y1="498" x2="116" y2="498" stroke="#ea580c" stroke-width="2.5"/><text x="124" y="502" class="b">writes (approved)</text>
  <line x1="92" y1="518" x2="116" y2="518" stroke="#7c3aed" stroke-width="2.5"/><text x="124" y="522" class="b">model calls</text>
  <line x1="92" y1="538" x2="116" y2="538" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/><text x="124" y="542" class="b">LLM trust boundary</text>
  <rect x="92" y="550" width="24" height="8" rx="2" fill="#ecfdf5" stroke="#10b981"/><text x="124" y="558" class="b">security control</text>

  <!-- ───────────── the container ───────────── -->
  <rect x="262" y="96" width="600" height="666" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="280" y="118" class="s">stridedj container · non-root · read-only filesystem · secrets from .env · state in a volume</text>

  <!-- row 1 -->
  <rect x="282" y="132" width="170" height="64" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="296" y="152" class="t">Input guard</text>
  <text x="296" y="170" class="b">allowlist · secret detector</text>
  <text x="296" y="186" class="b">length · rate limit</text>
  <rect x="472" y="132" width="370" height="64" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="486" y="152" class="t">StrideAgent · agent/service.py</text>
  <text x="486" y="170" class="b">per-chat session state · verifies the final answer</text>
  <text x="486" y="186" class="b">issues an approval token for a valid proposal</text>

  <!-- row 2: harness -->
  <rect x="282" y="214" width="560" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="276" y="208" width="572" height="182" rx="15" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="298" y="238" class="t">Agent harness · harness/</text>
  <text x="828" y="238" text-anchor="end" font-size="11" fill="#dc2626">only aggregates &amp; ids enter the model context</text>

  <rect x="298" y="252" width="120" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="358" y="270" text-anchor="middle" class="t" font-size="12">Context</text>
  <text x="358" y="286" text-anchor="middle" class="b">prompt v2 + date</text>
  <text x="358" y="300" text-anchor="middle" class="b">+ chat history</text>
  <rect x="436" y="252" width="120" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="496" y="270" text-anchor="middle" class="t" font-size="12">LLM client</text>
  <text x="496" y="286" text-anchor="middle" class="b">Responses API</text>
  <text x="496" y="300" text-anchor="middle" class="b">strict · stateless</text>
  <rect x="574" y="252" width="120" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="634" y="270" text-anchor="middle" class="t" font-size="12">Tool registry</text>
  <text x="634" y="286" text-anchor="middle" class="b">strict schemas</text>
  <text x="634" y="300" text-anchor="middle" class="b">validate · timeout</text>
  <rect x="712" y="252" width="116" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="770" y="270" text-anchor="middle" class="t" font-size="12">Final answer</text>
  <text x="770" y="286" text-anchor="middle" class="b">AgentReply JSON</text>
  <text x="770" y="300" text-anchor="middle" class="b">checked vs state</text>
  <line x1="418" y1="280" x2="434" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="556" y1="280" x2="572" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="694" y1="280" x2="710" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M634,308 C634,327 496,327 496,311" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#a-gray)"/>
  <text x="646" y="324" class="s">tool results feed the next step</text>

  <rect x="298" y="332" width="250" height="38" rx="19" fill="#ecfdf5" stroke="#10b981"/>
  <text x="423" y="355" text-anchor="middle" class="b">Budgets · 8 steps · 16 calls · $0.20 · 90 s</text>
  <rect x="566" y="332" width="262" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="697" y="355" text-anchor="middle" class="b">Transcript of every run → evals, debugging</text>

  <line x1="557" y1="390" x2="557" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>

  <!-- row 3: tools + services -->
  <rect x="282" y="402" width="380" height="196" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="298" y="426" class="t">6 read-only tools · agent/tools.py</text>
  <rect x="298" y="440" width="172" height="28" rx="6" fill="#eff6ff"/><text x="384" y="458" text-anchor="middle" class="m">estimate_duration</text>
  <rect x="482" y="440" width="172" height="28" rx="6" fill="#eff6ff"/><text x="568" y="458" text-anchor="middle" class="m">find_free_slots</text>
  <rect x="298" y="476" width="172" height="28" rx="6" fill="#eff6ff"/><text x="384" y="494" text-anchor="middle" class="m">draft_playlist</text>
  <rect x="482" y="476" width="172" height="28" rx="6" fill="#eff6ff"/><text x="568" y="494" text-anchor="middle" class="m">propose_plan</text>
  <rect x="298" y="512" width="172" height="28" rx="6" fill="#eff6ff"/><text x="384" y="530" text-anchor="middle" class="m">get_running_profile</text>
  <rect x="482" y="512" width="172" height="28" rx="6" fill="#eff6ff"/><text x="568" y="530" text-anchor="middle" class="m">predict_race_times</text>
  <text x="298" y="564" class="b">return aggregates and ids, never raw data or titles;</text>
  <text x="298" y="580" class="b">plans are built from session state, not model text</text>

  <rect x="682" y="402" width="160" height="56" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="694" y="424" class="t" font-size="12">RunInsights · runs/</text>
  <text x="694" y="442" class="b">durations · cadence</text>
  <rect x="682" y="472" width="160" height="56" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="694" y="494" class="t" font-size="12">SlotFinder · cal/</text>
  <text x="694" y="512" class="b">free/busy · DST-safe</text>
  <rect x="682" y="542" width="160" height="56" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="694" y="564" class="t" font-size="12">Playlists · music/</text>
  <text x="694" y="582" class="b">style · tempo folding</text>
  <line x1="662" y1="430" x2="680" y2="430" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <line x1="662" y1="500" x2="680" y2="500" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <line x1="662" y1="570" x2="680" y2="570" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>

  <!-- row 4: approvals + executor -->
  <rect x="282" y="618" width="270" height="128" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="298" y="642" class="t">Approval store · approvals.py</text>
  <text x="298" y="664" class="b">token bound to the plan hash + user</text>
  <text x="298" y="682" class="b">single use · expires after 15 min</text>
  <text x="298" y="700" class="b">only the requester can approve</text>
  <text x="298" y="726" class="s">TOCTOU-safe: a changed plan voids the token</text>
  <rect x="572" y="618" width="270" height="128" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="588" y="642" class="t">Executor · executor.py</text>
  <text x="588" y="664" class="b">the only writes in the system</text>
  <text x="588" y="682" class="b">fixed templates (no model text)</text>
  <text x="588" y="700" class="b">idempotent event id from plan hash</text>
  <text x="588" y="726" class="s">no attendees · private playlist</text>
  <line x1="552" y1="684" x2="570" y2="684" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>

  <!-- ───────────── external services ───────────── -->
  <rect x="920" y="214" width="250" height="88" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="936" y="238" class="t">OpenAI Responses API</text>
  <text x="936" y="256" class="b">gpt-6-luna · store=false</text>
  <text x="936" y="273" class="b">sees: your message, aggregates, ids</text>
  <text x="936" y="290" class="b">never: GPS, raw series, titles, secrets</text>
  <line x1="850" y1="262" x2="918" y2="262" stroke="#7c3aed" stroke-width="2" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>

  <rect x="920" y="402" width="250" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="936" y="424" class="t" font-size="12">Garmin Connect</text>
  <text x="936" y="442" class="b">runs, laps, HR zones (read)</text>
  <rect x="920" y="472" width="250" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="936" y="494" class="t" font-size="12">Google Calendar</text>
  <text x="936" y="512" class="b">freeBusy (read) · events.insert (write)</text>
  <rect x="920" y="542" width="250" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="936" y="564" class="t" font-size="12">Spotify + ReccoBeats</text>
  <text x="936" y="582" class="b">library, tempo (read) · playlist (write)</text>

  <!-- writes: executor → Google, Spotify -->
  <path d="M842,684 H892 V516 H918" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
  <path d="M892,586 H918" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
  <!-- reads: services → external -->
  <line x1="842" y1="420" x2="918" y2="420" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <line x1="842" y1="490" x2="918" y2="490" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <line x1="842" y1="560" x2="918" y2="560" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>

  <!-- ───────────── flows from/to the user ───────────── -->
  <line x1="224" y1="164" x2="280" y2="164" stroke="#475569" stroke-width="1.8" marker-start="url(#a-gray)" marker-end="url(#a-gray)"/>
  <text x="252" y="156" text-anchor="middle" class="s">chat</text>
  <line x1="452" y1="164" x2="470" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="657" y1="196" x2="657" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <path d="M60,328 V684 H280" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
  <text x="170" y="676" text-anchor="middle" class="b" fill="#9a3412">Approve tap → token</text>

  <text x="32" y="786" class="s">Every external box sits behind a port (ports.py): tests, evals and demo mode run the same agent against in-memory fakes.</text>
</svg>
