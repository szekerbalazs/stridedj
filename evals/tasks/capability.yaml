# Capability suite: harder cases (multi-turn edits, extrapolation, unit conversion, no free slot, ambiguity).
# Expected to start below 100 %: this is the hill to climb when changing prompts or models.

- id: c01-followup-move
  suite: capability
  description: A follow-up moves the plan; the second turn is graded.
  turns: ["10k Z2 tonight", "Make it tomorrow morning instead"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: tomorrow, day_part: morning}

- id: c02-followup-distance
  suite: capability
  description: A follow-up changes the distance only.
  turns: ["8k easy tomorrow evening", "Actually make it 12k"]
  expect: {kind: proposal, run_type: z2, distance_km: 12, date: tomorrow, day_part: evening}

- id: c03-half-marathon-extrapolation
  suite: capability
  description: No recent run that long → the duration must be extrapolated; a long slot must still fit the morning.
  turns: ["Half marathon at easy pace tomorrow morning"]
  expect: {kind: proposal, run_type: z2, distance_km: 21.1, date: tomorrow, day_part: morning}

- id: c04-intervals-with-distance
  suite: capability
  description: 'Intervals with a total but no reps: sessions sized to 9 km are offered; the picked one keeps the total.'
  turns: ["Interval session tomorrow evening, 9 km in total", "I choose interval session i2: 6 × 800 m @ 4:10, 90 s rest, 9 km in total."]
  expect: {kind: proposal, run_type: intervals, distance_km: 9, date: tomorrow, day_part: evening, session_id: i2}

- id: c05-intervals-no-distance
  suite: capability
  description: 6x800 says nothing about warm-up/cool-down → ask for the total distance.
  turns: ["6x800 on Tuesday morning"]
  expect: {kind: clarification, missing_fields: [distance], max_steps: 2}

- id: c06-miles
  suite: capability
  description: Unit conversion (10 miles = 16.1 km).
  turns: ["10 miles easy tomorrow morning"]
  expect: {kind: proposal, run_type: z2, distance_km: 16.1, date: tomorrow, day_part: morning}

- id: c07-no-free-slot
  suite: capability
  description: The evening is fully booked → no proposal; say so (and offer alternatives).
  turns: ["10k Z2 tonight"]
  env: {calendar: packed_evening}
  expect: {kind: [answer, clarification], must_call: [find_free_slots]}

- id: c08-long-run-sunday
  suite: capability
  description: Weekday that is tomorrow.
  turns: ["Plan my long run for Sunday morning, 18k Z2"]
  expect: {kind: proposal, run_type: z2, distance_km: 18, date: sunday, day_part: morning}

- id: c09-german-recovery
  suite: capability
  description: German, recovery → z1, tonight.
  turns: ["Kannst du mir für heute Abend einen 7 km Recovery-Lauf planen?"]
  expect: {kind: proposal, run_type: z1, distance_km: 7, date: today, day_part: evening}

- id: c10-next-saturday
  suite: capability
  description: '"Next Saturday" said on a Saturday means in 7 days.'
  turns: ["15k Z2 next Saturday morning"]
  expect: {kind: proposal, run_type: z2, distance_km: 15, date: saturday, day_part: morning}

- id: c11-calmer-followup
  suite: capability
  description: A follow-up changes only the music mood.
  turns: ["10k Z2 tonight", "Same run but calmer music please"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: today, day_part: evening, mood: calmer}

# ── a named start time (free times must not be reported as unavailable) ──
- id: c12-make-it-later
  suite: capability
  description: 'A named start that is free but not among the example slots (06:00, 07:45) must be checked and used.'
  turns: ["10k Z2 tomorrow morning", "6:00 is too early, make it 8:00"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: tomorrow, start_time: "08:00"}

- id: c13-time-between-day-parts
  suite: capability
  description: 10:00 lies between morning and midday; an explicit time wins over the day-part windows.
  turns: ["10k Z2 tomorrow at 10:00"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: tomorrow, start_time: "10:00"}

- id: c14-requested-time-busy
  suite: capability
  description: Monday 09:00 is during work → check exactly that start, don't propose it, offer the nearest free ones.
  turns: ["10k Z2 on Monday at 9:00"]
  expect: {kind: [answer, clarification], date: monday, start_time: "09:00", must_call: [find_free_slots]}

# ── interval sessions: ask once for warm-up/cool-down, then add it up (recoveries are standing rests) ──
- id: c15-intervals-asked-then-total
  suite: capability
  description: 'A three-message dialogue: after warm-up and cool-down are given, the total (2 + 3.2 + 1, standing rests) must be inferred, not asked.'
  turns: ["Interval run tonight", "4 x 800m + warm-up + cooldown", "2 km warm-up and 1 km cool-down"]
  expect: {kind: proposal, run_type: intervals, distance_km: 6.2, date: today, day_part: evening}

- id: c16-intervals-all-in-one
  suite: capability
  description: Reps, warm-up and cool-down in one message → no question; total 2 + 4 + 1.5 = 7.5 km (standing rests).
  turns: ["4x1k with 2 km warm-up and 1.5 km cool-down tomorrow evening"]
  expect: {kind: proposal, run_type: intervals, distance_km: 7.5, date: tomorrow, day_part: evening}

- id: c17-intervals-given-recovery
  suite: capability
  description: An explicit recovery overrides the default; total 2 + 5 + 4 × 0.4 + 2 = 10.6 km.
  turns: ["5x1000 m with 400 m jog recoveries, 2 km warm-up and 2 km cool-down, tomorrow morning"]
  expect: {kind: proposal, run_type: intervals, distance_km: 10.6, date: tomorrow, day_part: morning}

# ── where the songs come from ──
- id: c18-only-songs-i-know
  suite: capability
  description: Asking for known songs only maps to music=familiar.
  turns: ["10k Z2 tonight, only songs I know please"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: today, day_part: evening, music: familiar}

- id: c19-something-new
  suite: capability
  description: Asking for new music maps to music=discover (German, as typed on the phone).
  turns: ["8k Z2 morgen früh, mit neuer Musik die ich noch nicht kenne"]
  expect: {kind: proposal, run_type: z2, distance_km: 8, date: tomorrow, day_part: morning, music: discover}

- id: c20-music-followup
  suite: capability
  description: A follow-up changes only where the songs come from; everything else is kept.
  turns: ["10k Z2 tonight", "Same run, but only my running songs"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: today, day_part: evening, music: familiar}

- id: c21-genre-request
  suite: capability
  description: A named genre (as typed, "dnb") is passed as the closed genre value.
  turns: ["Z2 run tonight, 10k, with some dnb"]
  expect: {kind: proposal, run_type: z2, distance_km: 10, date: today, day_part: evening, genre: drum and bass}

- id: c22-genre-in-other-words
  suite: capability
  description: A German genre word ("Deutschrap") maps to the closest genre value.
  turns: ["Morgen früh 8 km locker, bitte mit Deutschrap"]
  expect: {kind: proposal, run_type: z2, distance_km: 8, date: tomorrow, day_part: morning, genre: hip hop}

# ── interval sessions offered as buttons ──
- id: c23-intervals-offer-sessions
  suite: capability
  description: An interval run without named reps → offer sessions (buttons), no plan, no numbers in the message.
  turns: ["Intervals tomorrow evening"]
  expect: {kind: clarification, must_call: [suggest_interval_sessions]}

- id: c24-intervals-picked-session
  suite: capability
  description: The tapped button arrives as a code-made message; the plan must carry that session and its total.
  turns: ["Intervals tomorrow evening", "I choose interval session i2: 6 × 800 m @ 4:10, 90 s rest, 8.3 km in total."]
  expect: {kind: proposal, run_type: intervals, distance_km: 8.3, date: tomorrow, day_part: evening, session_id: i2}
