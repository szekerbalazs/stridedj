[project]
name = "stridedj"
version = "0.1.0"
description = "A tool-calling running agent: plans a run from your Garmin history, books a calendar slot and builds a cadence-matched Spotify playlist."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    # core
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # LLM
    "openai>=2.0",
    # transports and integrations
    "python-telegram-bot>=21.6",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "garminconnect>=0.3",
    "curl_cffi>=0.7",
    # data science
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/szekerbalazs/stridedj"
Documentation = "https://github.com/szekerbalazs/stridedj/tree/main/docs"

[project.scripts]
stridedj = "stridedj.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stridedj"]

# ─────────────────────────────── ruff ───────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ANN",           # annotations everywhere
    "S",             # bandit (security)
    "PTH",           # pathlib over os.path
    "DTZ",           # timezone-aware datetimes only
    "ASYNC",         # async pitfalls
    "N",             # naming
]
ignore = [
    "ANN401",        # Any is sometimes the honest type (provider-native JSON)
    "RUF001", "RUF002", "RUF003",  # unicode in strings/docstrings/comments (×, –, …) is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ANN", "PLR2004"]
"evals/**" = ["S101"]
"notebooks/**" = ["ANN", "E501"]

# ─────────────────────────────── mypy ───────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/stridedj", "evals"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "garminconnect.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.oauth2.*",
    "google.auth.*",
    "sklearn.*",
    "curl_cffi.*",
]
ignore_missing_imports = true

# ─────────────────────────────── pytest ───────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: talks to a real external API (needs credentials; skipped by default)",
]

[tool.coverage.run]
source = ["src/stridedj"]
branch = true
